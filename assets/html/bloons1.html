<html>
<head>
    <style>
        html, body {
            margin: 0px;
            width: 100%;
            height: 100%;
            /* 1. Add black background for the borders */
            background-color: #000; 
            /* 2. Center the game perfectly on the screen */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #container {
            width: 100%;
            height: 100%;
            /* 3. Force 4:3 proportions based on screen size limits */
            aspect-ratio: 4 / 3;
            max-width: calc(100vh * (4 / 3));
            max-height: calc(100vw * (3 / 4));
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script src="../assets/ruffle/ruffle.js"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "splashScreen": false,
            "unmuteOverlay": "hidden",
            "quality": "medium" 
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            
            if (container) {
                container.appendChild(player);
                player.load("../assets/swf/bloons.swf");
                player.style.width = "100%";
                player.style.height = "100%";
            }
        });
    </script>
</body>
</html>
