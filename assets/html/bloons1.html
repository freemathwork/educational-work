<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4:3 Flash Game Player (Ruffle)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (4 / 3));
            max-height: calc(100vw * (3 / 4));
            aspect-ratio: 4 / 3;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- 1. Load your local self-hosted script -->
    <script src="../assets/ruffle/ruffle.js"></script>
</head>
<body>
    <div class="game-container" id="game-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        
        // Config options must be defined before creating the player instance
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden"
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            
            // Check if Ruffle script loaded successfully
            if (!ruffle) {
                console.error("Ruffle failed to initialize. Check your ruffle.js path.");
                return;
            }

            const player = ruffle.createPlayer();
            player.id = "ruffle-player";
            
            const container = document.getElementById("game-container");
            container.appendChild(player);
            
            // 2. Load your local SWF file using the parent-relative path
            player.load({
                url: "../assets/swf/bloons1.swf"
            });
        });
    </script>
</body>
</html>
