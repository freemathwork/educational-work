<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Work</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --hover-color: #393e46;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--hover-color);
            border-color: var(--accent-color);
            box-shadow: 0 8px 15px rgba(0, 173, 181, 0.4);
        }

        .status {
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Educational Work</h1>
        <p>All lessons are loaded automatically from the repository.</p>
    </header>

    <main class="grid" id="games-grid">
        <p class="status" id="status-msg">Loading lessons...</p>
    </main>

    <script>
        // CONFIGURATION: Change these to match your GitHub repository
        const USERNAME = 'freemathwork';
        const REPO = 'educational-work';
        const FOLDER_PATH = 'html'; 

        const grid = document.getElementById('games-grid');
        const statusMsg = document.getElementById('status-msg');

        async function fetchGames() {
            // GitHub API endpoint to list contents of a directory
            const apiUrl = `https://github.com{USERNAME}/${REPO}/contents/${FOLDER_PATH}`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch folder contents. Check your username, repository name, and folder path.');
                }

                const files = await response.json();
                
                // Filter for HTML files or folders (subdirectories representing games)
                const gameFiles = files.filter(file => file.name.endsWith('.html') || file.type === 'dir');

                if (gameFiles.length === 0) {
                    statusMsg.textContent = 'No lessons found in the "html" folder.';
                    return;
                }

                // Remove the loading message
                statusMsg.remove();

                gameFiles.forEach(file => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    
                    // Format the display name (e.g., "super-mario.html" or "super-mario" -> "Super Mario")
                    let gameName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                    gameName = gameName.replace(/\b\w/g, char => char.toUpperCase());
                    
                    card.textContent = gameName;

                    // Set target URL relative to your GitHub Pages deployment
                    // Works whether it's a direct HTML file or a subfolder containing an index.html
                    card.href = `./${FOLDER_PATH}/${file.name}`;
                    
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                statusMsg.textContent = 'Error loading lessons. Please check the console configuration.';
                statusMsg.style.color = '#ff4a4a';
            }
        }

        fetchGames();
    </script>
</body>
</html>
