<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games Hub</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --hover-color: #393e46;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--hover-color);
            border-color: var(--accent-color);
            box-shadow: 0 8px 15px rgba(0, 173, 181, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Unblocked Games Hub</h1>
        <p>A static list of games that sorts themselves alphabetically automatically.</p>
    </header>

    <!-- ADD YOUR GAMES DIRECTLY HERE -->
    <main class="grid" id="games-grid">
        <a class="card" href="./html/game1.html">test</a>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("games-grid");
            
            // Convert the collection of game links into an array
            const cards = Array.from(grid.getElementsByClassName("card"));

            // Sort the array alphabetically based on the visible text link
            cards.sort((a, b) => a.textContent.trim().localeCompare(b.textContent.trim()));

            // Clear the grid and re-append them in alphabetical order
            grid.innerHTML = "";
            cards.forEach(card => grid.appendChild(card));
        });
    </script>
</body>
</html>
